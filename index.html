<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DENYE CLOTHING | Kids Fashion</title>
  <style>
    :root {
      --pink: #ff8fb8;
      --lavender: #c4b5fd;
      --soft-bg: #fdf8fb;
      --card-bg: #ffffff;
      --text: #3f2e4d;
      --muted: #9a8aad;
      --border: #f0e6f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--soft-bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 18px rgba(180, 140, 180, 0.12);
    }

    .logo {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff8fb8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.75rem;
      display: block;
      font-weight: 500;
      color: var(--muted);
      margin-top: -2px;
    }

    .cart-btn {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      border: 2px solid #ffc2d6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 143, 184, 0.25);
      transition: transform 0.2s ease;
    }

    .cart-btn:hover { transform: scale(1.07); }

    .cart-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff5c9a;
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    .filters {
      padding: 1rem 1rem 0.75rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 72px;
      z-index: 90;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-list {
      display: flex;
      gap: 0.6rem;
      min-width: max-content;
      padding-bottom: 0.25rem;
    }

    .filter-btn {
      background: #f8f0f5;
      border: 1.5px solid transparent;
      color: var(--muted);
      padding: 0.55rem 1.1rem;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: #f3e8f0;
      color: var(--text);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #ff8fb8, #c4b5fd);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 143, 184, 0.3);
    }

    .products-section {
      padding: 1.25rem 1rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-count {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
      }
    }

    @media (min-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(160, 120, 170, 0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(160, 120, 170, 0.16);
    }

    .product-img-wrap {
      position: relative;
      aspect-ratio: 1 / 1.05;
      overflow: hidden;
      background: #f9f0f5;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255, 255, 255, 0.92);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      color: #7c5cbf;
    }

    .heart-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: transform 0.2s ease;
      z-index: 5;
    }

    .heart-btn:hover { transform: scale(1.12); }
    .heart-btn.liked { background: #fff0f3; }

    .product-info {
      padding: 0.85rem 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .product-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .product-price {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ff5c9a;
      margin-bottom: 0.75rem;
    }

    .add-btn {
      margin-top: auto;
      background: linear-gradient(135deg, #ff8fb8, #c4b5fd);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      opacity: 0.92;
      transform: scale(1.02);
    }

    /* Cart Modal */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(50, 30, 70, 0.45);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .cart-overlay.active { display: flex; }

    .cart-modal {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .cart-header {
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 { font-size: 1.25rem; color: #7c5cbf; }

    .close-cart {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #f5eef5;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1.4rem;
    }

    .cart-item {
      display: flex;
      gap: 0.9rem;
      padding: 1rem 0;
      border-bottom: 1px dashed var(--border);
      align-items: center;
    }

    .cart-item:last-child { border-bottom: none; }

    .cart-item-img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      background: #f9f0f5;
    }

    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: 0.95rem; }
    .cart-item-qty { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .cart-item-price { font-weight: 700; color: #ff5c9a; font-size: 0.95rem; }

    .empty-cart {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .cart-footer {
      padding: 1.2rem 1.4rem 1.6rem;
      border-top: 1px solid var(--border);
      background: #fdfbfe;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      border: none;
      padding: 0.95rem;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .checkout-btn:hover:not(:disabled) { transform: scale(1.02); }
    .checkout-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #7c5cbf;
      color: white;
      padding: 0.75rem 1.4rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 300;
      box-shadow: 0 8px 24px rgba(124, 92, 191, 0.35);
      transition: transform 0.3s ease;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      DENYE CLOTHING
      <span>Cute • Soft • Playful</span>
    </div>
    <button class="cart-btn" id="openCart" aria-label="Open cart">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="filters">
    <div class="filter-list" id="filterList">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="boys">Boys</button>
      <button class="filter-btn" data-filter="girls">Girls</button>
      <button class="filter-btn" data-filter="0-2">Ages 0-2</button>
      <button class="filter-btn" data-filter="3-5">Ages 3-5</button>
      <button class="filter-btn" data-filter="favorites">Favorites ❤️</button>
    </div>
  </div>

  <section class="products-section">
    <div class="section-title">
      <span>Shop Collection</span>
      <span class="product-count" id="productCount">10 items</span>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </section>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-modal">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-cart" id="closeCart">✕</button>
      </div>
      <div class="cart-body" id="cartBody">
        <div class="empty-cart">Your cart is empty 😊</div>
      </div>
      <div class="cart-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="cartTotal">₦0</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn" disabled>
          Checkout on WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Added to cart!</div>

  <script>
    // Products using your uploaded images
    // Make sure the .webp files are in the same folder as this HTML file
    const products = [
      {
        id: 1,
        name: "Cloud Puffer Jacket",
        price: 12500,
        img: "1000036842.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 2,
        name: "Classic Denim Overalls",
        price: 9800,
        img: "1000036841.webp",
        gender: "boys",
        age: "0-2",
        badge: "Boys"
      },
      {
        id: 3,
        name: "Striped Tee + Olive Shorts",
        price: 8500,
        img: "1000036840.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 4,
        name: "Dino Adventure Hoodie",
        price: 7900,
        img: "1000036839.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 5,
        name: "Rocket Bomber Jacket",
        price: 11200,
        img: "1000036837.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 6,
        name: "Rainbow Cable Sweater",
        price: 9500,
        img: "1000036836.webp",
        gender: "girls",
        age: "3-5",
        badge: "Girls"
      },
      {
        id: 7,
        name: "Rainy Duck Raincoat",
        price: 8900,
        img: "1000036835.webp",
        gender: "girls",
        age: "0-2",
        badge: "Girls"
      },
      {
        id: 8,
        name: "Blue Tracksuit Set",
        price: 10500,
        img: "1000036834.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 9,
        name: "Plaid Shirt + Shorts Set",
        price: 9200,
        img: "1000036833.webp",
        gender: "boys",
        age: "3-5",
        badge: "Boys"
      },
      {
        id: 10,
        name: "Blush Floral Dress",
        price: 8700,
        img: "1000036838.webp",
        gender: "girls",
        age: "0-2",
        badge: "Girls"
      }
    ];

    let cart = [];
    let currentFilter = "all";
    let likedIds = JSON.parse(localStorage.getItem("denyeLiked") || "[]");

    const grid = document.getElementById("productsGrid");
    const cartCountEl = document.getElementById("cartCount");
    const cartOverlay = document.getElementById("cartOverlay");
    const cartBody = document.getElementById("cartBody");
    const cartTotalEl = document.getElementById("cartTotal");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const productCountEl = document.getElementById("productCount");
    const toast = document.getElementById("toast");

    function saveLikes() {
      localStorage.setItem("denyeLiked", JSON.stringify(likedIds));
    }

    function toggleLike(id, event) {
      event.stopPropagation();
      const index = likedIds.indexOf(id);
      if (index === -1) {
        likedIds.push(id);
      } else {
        likedIds.splice(index, 1);
      }
      saveLikes();
      renderProducts();
    }

    function getFilteredProducts() {
      if (currentFilter === "favorites") {
        return products.filter(p => likedIds.includes(p.id));
      }
      if (currentFilter === "boys" || currentFilter === "girls") {
        return products.filter(p => p.gender === currentFilter);
      }
      if (currentFilter === "0-2" || currentFilter === "3-5") {
        return products.filter(p => p.age === currentFilter);
      }
      return products;
    }

    function renderProducts() {
      const filtered = getFilteredProducts();
      productCountEl.textContent = `\( {filtered.length} item \){filtered.length !== 1 ? "s" : ""}`;

      if (filtered.length === 0) {
        const msg = currentFilter === "favorites"
          ? "No favorites yet. Tap the 🤍 on products you love!"
          : "No products found in this category 😔";
        grid.innerHTML = `<div class="no-results">${msg}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const isLiked = likedIds.includes(p.id);
        return `
          <article class="product-card">
            <div class="product-img-wrap">
              <img src="\( {p.img}" alt=" \){p.name}" class="product-img" loading="lazy">
              <span class="badge">${p.badge}</span>
              <button class="heart-btn ${isLiked ? "liked" : ""}" 
                      onclick="toggleLike(${p.id}, event)"
                      aria-label="${isLiked ? "Unlike" : "Like"}">
                ${isLiked ? "❤️" : "🤍"}
              </button>
            </div>
            <div class="product-info">
              <h3 class="product-name">${p.name}</h3>
              <div class="product-meta">${p.age === "0-2" ? "Ages 0–2" : "Ages 3–5"}</div>
              <div class="product-price">₦${p.price.toLocaleString()}</div>
              <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </article>
        `;
      }).join("");
    }

    document.getElementById("filterList").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderProducts();
    });

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      showToast(`${product.name} added!`);
    }

    function updateCartUI() {
      const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
      cartCountEl.textContent = totalItems;

      if (cart.length === 0) {
        cartBody.innerHTML = `<div class="empty-cart">Your cart is empty 😊</div>`;
        cartTotalEl.textContent = "₦0";
        checkoutBtn.disabled = true;
        return;
      }

      cartBody.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="\( {item.img}" alt=" \){item.name}" class="cart-item-img">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-qty">Qty: ${item.qty}</div>
          </div>
          <div class="cart-item-price">₦${(item.price * item.qty).toLocaleString()}</div>
        </div>
      `).join("");

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      cartTotalEl.textContent = `₦${total.toLocaleString()}`;
      checkoutBtn.disabled = false;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    document.getElementById("openCart").addEventListener("click", () => {
      cartOverlay.classList.add("active");
    });

    document.getElementById("closeCart").addEventListener("click", () => {
      cartOverlay.classList.remove("active");
    });

    cartOverlay.addEventListener("click", (e) => {
      if (e.target === cartOverlay) cartOverlay.classList.remove("active");
    });

    checkoutBtn.addEventListener("click", () => {
      if (cart.length === 0) return;

      let message = `Hi DENYE CLOTHING! 👋\n\nI'd like to order:\n\n`;
      cart.forEach(item => {
        message += `• ${item.name} × \( {item.qty} — ₦ \){(item.price * item.qty).toLocaleString()}\n`;
      });
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      message += `\n*Total: ₦${total.toLocaleString()}*\n\nPlease confirm availability. Thank you! 💕`;

      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/09157340963?text=${encoded}`, "_blank");
    });

    // Initialize
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
