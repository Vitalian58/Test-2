<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DENYE CLOTHING | Cute Kids Apparel</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #FFB7B2; /* Pastel Pink */
      --secondary: #E2F0CB; /* Pastel Green */
      --accent: #B5EAD7; /* Pastel Mint */
      --background: #FAFAFA;
      --text: #555555;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--background);
      color: var(--text);
    }

    header {
      background-color: var(--white);
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      color: #FF9AA2;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }

    header p {
      color: #888;
      font-size: 1.1rem;
      margin-top: 5px;
    }

    .container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
      text-align: center;
      padding-bottom: 1.5rem;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-bottom: 5px solid var(--accent);
    }

    .product-info {
      padding: 1.5rem 1rem;
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.2rem;
      color: #FF9AA2;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .add-to-cart-btn {
      background-color: var(--accent);
      color: #333;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .add-to-cart-btn:hover {
      background-color: #9cd4c2;
    }

    /* Floating Cart Icon */
    #cart-widget {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: var(--primary);
      color: white;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      box-shadow: 0 10px 20px rgba(255, 183, 178, 0.6);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s;
    }

    #cart-widget:hover {
      transform: scale(1.1);
    }

    #cart-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: white;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 700;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Cart Modal */
    #cart-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--white);
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      padding: 2rem;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .cart-items-list {
      list-style: none;
      margin: 1.5rem 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #ccc;
    }

    .cart-total {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: right;
      margin-bottom: 1.5rem;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      background-color: #25D366; /* WhatsApp Green */
      color: white;
      text-align: center;
      padding: 15px;
      border: none;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.3s;
    }

    .checkout-btn:hover {
      background-color: #1EBE55;
    }

    .checkout-btn i {
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>DENYE CLOTHING</h1>
    <p>Cute, Comfy, and Colorful Kids Wear!</p>
  </header>

  <div class="container">
    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1519241047957-be31d7379a5d?auto=format&fit=crop&w=500&q=80" alt="Pastel Romper">
        <div class="product-info">
          <h3 class="product-title">Pastel Pink Romper</h3>
          <p class="product-price">₦8,500</p>
          <button class="add-to-cart-btn" data-name="Pastel Pink Romper" data-price="8500">Add to Cart</button>
        </div>
      </div>
      <!-- Product 2 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1622290291468-a28f7a7dc6a8?auto=format&fit=crop&w=500&q=80" alt="Sunny Day Dress">
        <div class="product-info">
          <h3 class="product-title">Sunny Day Dress</h3>
          <p class="product-price">₦9,000</p>
          <button class="add-to-cart-btn" data-name="Sunny Day Dress" data-price="9000">Add to Cart</button>
        </div>
      </div>
      <!-- Product 3 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&w=500&q=80" alt="Denim Overalls">
        <div class="product-info">
          <h3 class="product-title">Classic Denim Overalls</h3>
          <p class="product-price">₦12,000</p>
          <button class="add-to-cart-btn" data-name="Classic Denim Overalls" data-price="12000">Add to Cart</button>
        </div>
      </div>
      <!-- Product 4 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1471286174890-9c11241eb436?auto=format&fit=crop&w=500&q=80" alt="Mint Green Onesie">
        <div class="product-info">
          <h3 class="product-title">Mint Green Onesie</h3>
          <p class="product-price">₦5,500</p>
          <button class="add-to-cart-btn" data-name="Mint Green Onesie" data-price="5500">Add to Cart</button>
        </div>
      </div>
      <!-- Product 5 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1514090458221-65bb69cf63e6?auto=format&fit=crop&w=500&q=80" alt="Polka Dot Shirt">
        <div class="product-info">
          <h3 class="product-title">Polka Dot Shirt</h3>
          <p class="product-price">₦7,000</p>
          <button class="add-to-cart-btn" data-name="Polka Dot Shirt" data-price="7000">Add to Cart</button>
        </div>
      </div>
      <!-- Product 6 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1522771930-78848d92878d?auto=format&fit=crop&w=500&q=80" alt="Cozy Winter Jacket">
        <div class="product-info">
          <h3 class="product-title">Cozy Winter Jacket</h3>
          <p class="product-price">₦15,000</p>
          <button class="add-to-cart-btn" data-name="Cozy Winter Jacket" data-price="15000">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Cart -->
  <div id="cart-widget" onclick="toggleCart()">
    <i class="fas fa-shopping-cart"></i>
    <span id="cart-badge">0</span>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal">
    <div class="modal-content">
      <span class="close-modal" onclick="toggleCart()">&times;</span>
      <h2>Your Cart</h2>
      <ul class="cart-items-list" id="cart-items-list">
        <!-- Items will be injected here via JS -->
      </ul>
      <div class="cart-total">
        Total: ₦<span id="cart-total-price">0</span>
      </div>
      <button class="checkout-btn" onclick="checkoutToWhatsApp()">
        <i class="fab fa-whatsapp"></i> Checkout via WhatsApp
      </button>
    </div>
  </div>

  <script>
    // Cart State
    let cart = [];

    // Elements
    const cartBadge = document.getElementById('cart-badge');
    const cartModal = document.getElementById('cart-modal');
    const cartItemsList = document.getElementById('cart-items-list');
    const cartTotalPrice = document.getElementById('cart-total-price');

    // Add to Cart Logic
    document.querySelectorAll('.add-to-cart-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        const name = e.target.getAttribute('data-name');
        const price = parseInt(e.target.getAttribute('data-price'));
        
        cart.push({ name, price });
        updateCartUI();
        
        // Brief button animation
        const originalText = e.target.innerText;
        e.target.innerText = "Added! ✓";
        e.target.style.backgroundColor = "var(--secondary)";
        setTimeout(() => {
          e.target.innerText = originalText;
          e.target.style.backgroundColor = "var(--accent)";
        }, 1000);
      });
    });

    // Update UI
    function updateCartUI() {
      cartBadge.innerText = cart.length;
      
      cartItemsList.innerHTML = '';
      let total = 0;
      
      cart.forEach((item, index) => {
        total += item.price;
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <span>${item.name}</span>
          <span>₦${item.price.toLocaleString()}</span>
        `;
        cartItemsList.appendChild(li);
      });

      if (cart.length === 0) {
        cartItemsList.innerHTML = '<li>Your cart is empty.</li>';
      }

      cartTotalPrice.innerText = total.toLocaleString();
    }

    // Toggle Modal
    function toggleCart() {
      if (cartModal.style.display === "flex") {
        cartModal.style.display = "none";
      } else {
        cartModal.style.display = "flex";
      }
    }

    // Close modal when clicking outside of it
    window.onclick = function(event) {
      if (event.target == cartModal) {
        cartModal.style.display = "none";
      }
    }

    // WhatsApp Checkout Logic
    function checkoutToWhatsApp() {
      if (cart.length === 0) {
        alert("Your cart is empty! Please add some cute clothes first.");
        return;
      }

      let message = "Hello DENYE CLOTHING! 🛍️\nI would like to place an order for:\n\n";
      let total = 0;

      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} - ₦${item.price.toLocaleString()}\n`;
        total += item.price;
      });

      message += `\n*Total: ₦${total.toLocaleString()}*\n\nPlease let me know how to proceed with payment and delivery.`;

      // The provided WhatsApp Number
      const phoneNumber = "2349157340963"; // Removed leading 0, added 234 country code for Nigeria
      const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

      // Open WhatsApp
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
